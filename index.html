<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; connect-src * https: wss:; img-src * data: blob:;">
        <meta name="description" content="TSA Training：請以學校電郵 sXXXXXXX@ngwahsec.edu.hk 登入，密碼為出生年月日（例 19980101）。">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <title>潛行數界傳奇</title>
    </head>
    <body style="background-color: black">
        <!-- config.js 必載入；defaults.js 僅本機覆寫；gate 等 defaults 結束（或略過）後再載入 -->
        <script type="text/javascript" src="js/school-auth-config.js?v=20260910"></script>
        <script type="text/javascript">
        (function () {
            function loadGate() {
                var s = document.createElement('script');
                s.src = 'js/school-auth-gate.js?v=20260910';
                document.body.appendChild(s);
            }
            var h = location.hostname;
            if (h !== 'localhost' && h !== '127.0.0.1') {
                loadGate();
                return;
            }
            var d = document.createElement('script');
            d.src = 'js/school-auth-config.defaults.js?v=20260910';
            d.onload = loadGate;
            d.onerror = loadGate;
            document.head.appendChild(d);
        })();
        </script>
    </body>
</html>
